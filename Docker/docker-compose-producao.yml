name: landingpage-aryaraj

# Definição dos Serviços
services:
  # --- Serviço Unificado (Frontend + Backend) ---
  web:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.producao
      args:
        # Passa a variável VITE_API_URL em tempo de build para caminhos relativos ou específicos
        - VITE_API_URL=${VITE_API_URL}
    image: aryalvesfernandes/landingpageapioficial:1.0.6
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      # Variáveis de ambiente da Stack lidas do arquivo .env ou do ambiente do Host
      - VITE_API_URL=${VITE_API_URL}
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SECRET_TOKEN=${SECRET_TOKEN:-aryaraj_secret_token_2026}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # Habilita roteamento do Traefik para o serviço unificado
        - traefik.enable=true
        # Roteamento do Domínio Principal para a raiz (Frontend) e caminhos /api (Backend)
        - traefik.http.routers.landingpage_web.rule=Host(`zap.aryaraj.shop`)
        - traefik.http.routers.landingpage_web.entrypoints=websecure
        - traefik.http.routers.landingpage_web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.landingpage_web.service=landingpage_web
        # Define a porta do serviço unificado (FastAPI rodando na porta 8000)
        - traefik.http.services.landingpage_web.loadbalancer.server.port=8000
        - traefik.http.services.landingpage_web.loadbalancer.passHostHeader=true
        # Middleware para trabalhar com cabeçalhos SSL corretos
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.landingpage_web.middlewares=sslheader@docker
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

# Definições de Rede
networks:
  # Rede externa pública do Traefik
  network_swarm_public:
    name: network_swarm_public
    external: true
